<section class="dt-card" [class.dt-reserve-search]="reserveSearchSpace" [class.dt-searching]="searchOpen"
         [class.dt-no-header]="!showHeader" [class.dt-inset-divider]="insetRowDivider">
  <tb-widget-header *ngIf="showHeader" [icon]="icon" [title]="title">
    <span widget-header-actions class="dt-actions" *ngIf="searchEnabled || actions.length">
      <button *ngFor="let action of actions; trackBy: trackByActionId" (click)="actionClick.emit(action.id)"
              [class.active]="action.active" [attr.aria-label]="action.tooltip" [matTooltip]="action.tooltip || ''"
              class="dt-icon-btn" type="button">
        <mat-icon>{{ action.icon }}</mat-icon>
      </button>
      <button *ngIf="searchEnabled" (click)="toggleSearch()" [class.active]="searchOpen"
              [class.dt-search-first]="searchFirst" class="dt-icon-btn" type="button" aria-label="Search"
              matTooltip="Search">
        <mat-icon>search</mat-icon>
      </button>
    </span>
  </tb-widget-header>

  <div *ngIf="searchEnabled && searchOpen" class="dt-search">
    <mat-icon>search</mat-icon>
    <input #searchInput (input)="applyFilter(searchInput.value)" [placeholder]="searchPlaceholder" type="text" />
    <button (click)="toggleSearch()" class="dt-search-clear" type="button" aria-label="Clear search">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Optional consumer-projected filter bar (rendered below the header/search). -->
  <ng-content select="[dt-filter-bar]"></ng-content>

  <div #scroll class="dt-scroll" [class.dt-fluid]="!paginated"
       [style.minHeight.px]="fitPageSize ? fitHeightPx : null"
       [style.maxHeight.px]="fitPageSize ? fitHeightPx : null">
    <table [dataSource]="dataSource" [trackBy]="trackByRow" class="dt-table" mat-table>
      <!-- Leading checkbox column for bulk selection (rendered only when multiSelect,
           via displayedColumns). Header is select-all with an indeterminate dash. -->
      <ng-container matColumnDef="__select">
        <th *matHeaderCellDef mat-header-cell class="dt-select-cell">
          <button type="button" role="checkbox" class="dt-checkbox" [class.checked]="allChecked"
                  [class.indeterminate]="someChecked && !allChecked"
                  [attr.aria-checked]="someChecked && !allChecked ? 'mixed' : allChecked"
                  [attr.aria-label]="allChecked ? 'Deselect all' : 'Select all'" (click)="toggleAll(!allChecked)">
            <mat-icon>{{ allChecked ? "check" : "remove" }}</mat-icon>
          </button>
        </th>
        <td *matCellDef="let row" mat-cell class="dt-select-cell" (click)="$event.stopPropagation()">
          <button type="button" role="checkbox" class="dt-checkbox" [class.checked]="isChecked(row)"
                  [attr.aria-checked]="isChecked(row)" aria-label="Select row" (click)="toggleRow(row)">
            <mat-icon>check</mat-icon>
          </button>
        </td>
      </ng-container>

      <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
        <th *matHeaderCellDef mat-header-cell [class.dt-align-right]="col.align === 'right'">
          {{ showColumnHeaders ? col.header : "" }}
        </th>
        <td *matCellDef="let row" mat-cell [class.dt-align-right]="col.align === 'right'">
          <ng-container *ngIf="cellTemplate(col.key) as customCell; else builtinCell">
            <ng-container *ngTemplateOutlet="customCell; context: { $implicit: row, row: row }"></ng-container>
          </ng-container>
          <ng-template #builtinCell>
            <ng-container *ngIf="col.chip; else maybePrimary">
              <span class="dt-chip" [class.active]="chipActive(row, col)" [class.inactive]="!chipActive(row, col)">
                {{ row[col.key] }}
              </span>
            </ng-container>
            <ng-template #maybePrimary>
              <div *ngIf="col.subtitleKey; else textCell" class="dt-primary">
                <div class="dt-primary-title">{{ row[col.key] }}</div>
                <div class="dt-primary-sub">{{ row[col.subtitleKey] }}</div>
              </div>
              <ng-template #textCell>
                <tb-copy-box *ngIf="col.copyable; else plainText" [value]="row[col.key]" [width]="col.copyWidth"
                             [copyValue]="col.copyValueKey ? row[col.copyValueKey] : undefined"></tb-copy-box>
                <ng-template #plainText>{{ row[col.key] }}</ng-template>
              </ng-template>
            </ng-template>
          </ng-template>
        </td>
      </ng-container>

      <tr *matHeaderRowDef="displayedColumns; sticky: true" mat-header-row
          [style.display]="showColumnHeaders || multiSelect ? '' : 'none'"></tr>
      <tr *matRowDef="let row; columns: displayedColumns" mat-row
          [class.dt-row-clickable]="selectable" [class.dt-row-selected]="isRowSelected(row)"
          [attr.role]="selectable ? 'button' : null" [attr.tabindex]="selectable ? 0 : null"
          (click)="onRowClick(row)" (keydown.enter)="onRowClick(row)"></tr>
      <tr *matNoDataRow class="dt-no-data">
        <td [attr.colspan]="displayedColumns.length" class="dt-no-data-cell">
          <div class="dt-empty">
            <mat-icon *ngIf="emptyIcon && !loading" class="dt-empty-icon">{{ emptyIcon }}</mat-icon>
            <span>{{ loading ? loadingText : emptyText }}</span>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator *ngIf="paginated" #paginator [hidePageSize]="true" [pageSize]="pageSize"
                 showFirstLastButtons></mat-paginator>
</section>
